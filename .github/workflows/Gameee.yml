
name: Build TinyWorld APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract project
        run: unzip -q TinyWorld-upd.zip

      - name: Download libraries
        run: |
          cd TinyWorld
          sh get-libs.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build APK
        run: |
          cd TinyWorld
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TinyWorld-APK
          path: TinyWorld/app/build/outputs/apk/debug/app-debug.apk
          
